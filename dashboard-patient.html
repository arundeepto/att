<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#006a4e" />
<title>Health Portal · IHMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-slate-50 pb-20">

<!-- NAVBAR -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#006a4e] to-[#00875a] flex items-center justify-center text-white text-lg font-bold shadow">⚕️</div>
      <div>
        <h1 class="font-bold text-gray-800 text-sm leading-tight">IHMS</h1>
        <p class="text-[9px] text-gray-400 tracking-widest uppercase">Health Portal</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <!-- SOS বাটন (লুকানো থাকবে, অ্যাডমিট হলে দেখাবে) -->
      <button id="emergencyBtn" class="hidden emergency-pulse text-xs md:text-sm bg-red-500 hover:bg-red-600 text-white px-3 md:px-4 py-2 rounded-lg font-medium">🚨 SOS</button>
      <button id="logoutBtn" class="text-xs md:text-sm px-3 md:px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50">Logout</button>
    </div>
  </div>
</nav>

<!-- TABS -->
<div class="bg-white border-b border-gray-200 sticky top-16 z-30">
  <div class="max-w-7xl mx-auto px-2 md:px-4 flex gap-1 overflow-x-auto no-scrollbar">
    <button data-tab="home" class="tab-btn active">🏠 Home</button>
    <button data-tab="scanner" class="tab-btn">🤖 AI Scan</button>
    <button data-tab="doctors" class="tab-btn">🩺 Find Doctor</button>
    <button data-tab="chat" class="tab-btn">💬 Chat</button>
    <button data-tab="history" class="tab-btn">📋 History</button>
    <button data-tab="meds" class="tab-btn">💊 Meds</button>
  </div>
</div>

<main class="max-w-7xl mx-auto p-3 md:p-6">

<!-- 1. HOME TAB -->
<section id="tab-home" class="tab-panel">
  <div class="grid lg:grid-cols-3 gap-4 md:gap-6">
    <div class="lg:col-span-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-5 medical-gradient">
      <h2 class="font-semibold text-gray-800 mb-4">Digital Health Pass</h2>
      <div class="flex items-center gap-4">
        <canvas id="qrCanvas" class="rounded-xl"></canvas>
        <div>
          <p class="text-[10px] text-gray-400">HEALTH ID</p>
          <p id="healthIdText" class="font-mono font-bold text-[#006a4e] text-sm">—</p>
          <p class="text-xs mt-2">Blood: <b id="bloodText">—</b></p>
        </div>
      </div>
    </div>

    <!-- Admission Info -->
    <div id="admissionCard" class="hidden lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-5 border-l-4 border-l-blue-500">
      <h2 class="font-semibold text-gray-800 mb-2">🏥 Hospital Admission</h2>
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div><p class="text-xs text-gray-500">Department</p><p id="admDept" class="font-medium">—</p></div>
        <div><p class="text-xs text-gray-500">Room / Bed</p><p id="admRoom" class="font-medium">—</p></div>
      </div>
      <div class="mt-4">
        <h3 class="font-semibold text-gray-700 text-sm mb-2">💉 Active Treatments</h3>
        <div id="treatmentList" class="space-y-2 text-xs">
          <p class="text-gray-400">No treatments logged.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 2. FIND DOCTOR TAB -->
<section id="tab-doctors" class="tab-panel hidden">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
    <h2 class="text-lg font-bold text-gray-800 mb-4">🩺 Available Doctors</h2>
    <div id="doctorList" class="grid md:grid-cols-2 gap-3">
      <p class="text-sm text-gray-400">Loading...</p>
    </div>
  </div>
</section>

<!-- 3. CHAT TAB -->
<section id="tab-chat" class="tab-panel hidden">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 max-w-2xl mx-auto">
    <h2 class="text-lg font-bold text-gray-800 mb-4">💬 Chat with Doctor</h2>
    <div id="chatMessages" class="h-64 overflow-y-auto bg-slate-50 rounded-xl p-3 mb-3 space-y-2 text-sm border">
      <p class="text-gray-400 text-center">Select a doctor from Find Doctor tab to start chatting.</p>
    </div>
    <div class="flex gap-2">
      <input id="chatInput" type="text" class="flex-1 border rounded-xl p-3 text-sm" placeholder="Type a message..." disabled>
      <button id="chatSendBtn" class="bg-[#006a4e] text-white px-5 rounded-xl font-medium disabled:opacity-50" disabled>Send</button>
    </div>
  </div>
</section>

<!-- 4. HISTORY & MEDS TAB (আগের মতোই) -->
<section id="tab-history" class="tab-panel hidden"><div class="bg-white p-5 rounded-2xl shadow-sm border"><h2 class="text-lg font-bold mb-4">📋 History</h2><div id="fullHistoryList"></div></div></section>
<section id="tab-meds" class="tab-panel hidden"><div class="bg-white p-5 rounded-2xl shadow-sm border"><h2 class="text-lg font-bold mb-4">💊 Meds</h2><div id="medsList"></div></div></section>

</main>

<script type="module" src="js/patient.js"></script>
</body>
</html>
