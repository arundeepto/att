    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --danger: #e74c3c; --success: #27ae60; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 20px; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; }
        
        .progress-container { background: #eee; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }
        
        .card { padding: 20px; background: #f9f9f9; border-radius: 15px; text-align: center; margin: 20px 0; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        
        .action-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .summary-box { border: 1px solid #ddd; padding: 15px; border-radius: 10px; margin-top: 20px; background: white; }
        #report-date { font-weight: bold; color: var(--primary); margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3 style="margin:0">অরুণদীপ্ত Attendance</h3>
        <small id="current-date-ui"></small>
        <select id="subject-select" onchange="resetUI()">
            <option value="Anatomy">Anatomy</option>
            <option value="Physiology">Physiology</option>
            <option value="Biochemistry">Biochemistry</option>
        </select>
        <div class="progress-container"><div id="progress-bar"></div></div>
    </div>

    <div id="mark-section">
        <div class="card">
            <div id="roll-display" style="color: #666;">Roll: 1</div>
            <div id="name-display" style="font-size: 20px; font-weight: bold; margin: 10px 0;">---</div>
        </div>
        <div class="btn-row">
            <button style="background: var(--danger);" onclick="mark('Absent')">ABSENT</button>
            <button style="background: var(--success);" onclick="mark('Present')">PRESENT</button>
        </div>
        <button style="background: #95a5a6; width: 100%; margin-top:10px;" onclick="undo()">Undo</button>
    </div>

    <div class="summary-box" id="capture-area">
        <h4 style="margin:0">Absent List</h4>
        <div id="report-date"></div> <div id="absent-list-output">No absent yet.</div>
    </div>

    <div class="action-btns">
        <button style="background: var(--primary);" onclick="downloadPNG()">📸 Download PNG</button>
        <button style="background: var(--accent);" onclick="copyWhatsAppMessage()">📋 Copy WhatsApp Message</button>
    </div>
</div>

    let attendance = JSON.parse(localStorage.getItem('attendance_data')) || {};
    let currentIndex = 0;

    function getSubject() { return document.getElementById('subject-select').value; }
    
    // তারিখ সেট করার ফাংশন
    function setDateDisplay() {
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateStr = new Date().toLocaleDateString('en-US', dateOptions);
        document.getElementById('current-date-ui').innerText = dateStr;
        document.getElementById('report-date').innerText = "Date: " + dateStr;
    }

    function updateUI() {
        if (!attendance[getSubject()]) attendance[getSubject()] = {};
        
        let progress = (currentIndex / students.length) * 100;
        document.getElementById('progress-bar').style.width = progress + "%";
        
        if (currentIndex < students.length) {
            document.getElementById('roll-display').innerText = "Roll: " + students[currentIndex].roll;
            document.getElementById('name-display').innerText = students[currentIndex].name;
        } else {
            document.getElementById('name-display').innerText = "Session Complete! ✅";
        }
        renderList();
    }

    function mark(status) {
        if (currentIndex < students.length) {
            attendance[getSubject()][students[currentIndex].roll] = status;
            currentIndex++;
            localStorage.setItem('attendance_data', JSON.stringify(attendance));
            updateUI();
        }
    }

    function undo() {
        if (currentIndex > 0) {
            currentIndex--;
            delete attendance[getSubject()][students[currentIndex].roll];
            updateUI();
        }
    }

    function renderList() {
        let list = attendance[getSubject()];
        let html = "<ul style='padding-left: 20px; margin: 0;'>";
        students.forEach(s => {
            if(list[s.roll] === 'Absent') html += `<li>Roll ${s.roll}: ${s.name}</li>`;
        });
        html += "</ul>";
        document.getElementById('absent-list-output').innerHTML = html || "All Present! 🎉";
    }

    function downloadPNG() {
        // PNG ডাউনলোডের সময় ব্যাকগ্রাউন্ড সাদা রাখার জন্য
        document.getElementById("capture-area").style.background = "white";
        html2canvas(document.getElementById("capture-area")).then(canvas => {
            let link = document.createElement("a");
            link.download = `Absent_${getSubject()}_${new Date().toLocaleDateString().replace(/\//g, '-')}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function copyWhatsAppMessage() {
        const dateStr = new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
        let msg = `*Absent List: ${getSubject()}*\n*Date: ${dateStr}*\n\n`;
        let count = 0;
        students.forEach(s => {
            if(attendance[getSubject()][s.roll] === 'Absent') {
                msg += `❌ Roll ${s.roll}: ${s.name}\n`;
                count++;
            }
        });
        if(count === 0) msg += "All present today! ✅";
        navigator.clipboard.writeText(msg);
        alert("Copied! Now paste to WhatsApp.");
    }

    function resetUI() { currentIndex = 0; updateUI(); }
    
    // লোড হওয়ার সময় ডেট সেট হবে
    setDateDisplay();
    updateUI();
