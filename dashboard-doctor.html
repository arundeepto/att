<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#006a4e" />
<title>Doctor Dashboard · IHMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-slate-50 pb-20">

<!-- NAVBAR -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#006a4e] to-[#00875a] flex items-center justify-center text-white text-lg font-bold shadow">🩺</div>
      <div>
        <h1 class="font-bold text-gray-800 text-sm leading-tight">IHMS</h1>
        <p class="text-[9px] text-gray-400 tracking-widest">DOCTOR PORTAL</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="bmdcBadge" class="hidden sm:flex text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full items-center gap-1">
        ✅ BMDC Verified
      </span>
      <span id="doctorName" class="hidden md:block text-sm text-gray-600"></span>
      <button id="logoutBtn" class="text-xs md:text-sm px-3 md:px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50">Logout</button>
    </div>
  </div>
</nav>

<!-- TABS -->
<div class="bg-white border-b border-gray-200 sticky top-16 z-30">
  <div class="max-w-7xl mx-auto px-2 md:px-4 flex gap-1 overflow-x-auto no-scrollbar">
    <button data-tab="search" class="tab-btn active">🔍 Patient Search</button>
    <button data-tab="prescribe" class="tab-btn">✍️ Create Rx</button>
    <button data-tab="emergency" class="tab-btn">🚨 Emergency</button>
    <button data-tab="referrals" class="tab-btn">🔀 Referrals</button>
    <button data-tab="schedule" class="tab-btn">📅 Appointments</button>
  </div>
</div>

<main class="max-w-7xl mx-auto p-3 md:p-6">

  <!-- ========== TAB 1: SEARCH PATIENT ========== -->
  <section id="tab-search" class="tab-panel">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-4">🔍 Search Patient by Health ID</h2>
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="searchId" placeholder="Enter Health ID (e.g. IHMS-A3F9K2)"
          class="flex-1 border rounded-xl p-3 text-sm focus:ring-2 focus:ring-[#006a4e] outline-none" />
        <button id="searchBtn" class="bg-[#006a4e] hover:bg-[#005a42] text-white px-6 py-3 rounded-xl text-sm font-medium">
          Search
        </button>
      </div>
      <p id="searchStatus" class="text-xs text-gray-500 mt-2"></p>

      <div id="patientResult" class="mt-6 hidden"></div>
    </div>
  </section>

  <!-- ========== TAB 2: CREATE PRESCRIPTION ========== -->
  <section id="tab-prescribe" class="tab-panel hidden">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-4">✍️ Create Prescription</h2>

      <div class="grid md:grid-cols-2 gap-5">
        <div class="space-y-3 text-sm">
          <div>
            <label class="text-xs text-gray-500 font-medium">Patient Health ID</label>
            <input id="rxPatientId" class="w-full border rounded-xl p-3 mt-1" placeholder="IHMS-XXXXXX" />
          </div>
          <div>
            <label class="text-xs text-gray-500 font-medium">Patient Name</label>
            <input id="rxPatientName" class="w-full border rounded-xl p-3 mt-1" placeholder="Auto-filled on search" />
          </div>
          <div>
            <label class="text-xs text-gray-500 font-medium">Date</label>
            <input id="rxDate" type="date" class="w-full border rounded-xl p-3 mt-1" />
          </div>
          <div>
            <label class="text-xs text-gray-500 font-medium">Diagnosis</label>
            <input id="rxDiagnosis" class="w-full border rounded-xl p-3 mt-1" placeholder="e.g. Acute bronchitis" />
          </div>
        </div>

        <div class="space-y-3 text-sm">
          <div>
            <label class="text-xs text-gray-500 font-medium">Medications</label>
            <textarea id="rxMeds" rows="6" class="w-full border rounded-xl p-3 mt-1 font-mono text-xs"
              placeholder="Paracetamol | 500mg | 1-1-1 | 3 days&#10;Amoxicillin | 500mg | 1-0-1 | 5 days"></textarea>
            <p class="text-[10px] text-gray-400 mt-1">Format: name | dosage | frequency | duration (one per line)</p>
          </div>
          <div>
            <label class="text-xs text-gray-500 font-medium">Doctor's Notes</label>
            <textarea id="rxNotes" rows="3" class="w-full border rounded-xl p-3 mt-1" placeholder="Rest, fluids, follow-up..."></textarea>
          </div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button id="rxSaveBtn" class="flex-1 bg-[#006a4e] hover:bg-[#005a42] text-white py-3 rounded-xl font-medium">
          💾 Save Prescription
        </button>
        <button id="rxClearBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-medium">
          🔄 Clear Form
        </button>
      </div>
      <p id="rxStatus" class="text-xs text-green-700 mt-2 text-center"></p>
    </div>
  </section>

  <!-- ========== TAB 3: EMERGENCY ========== -->
  <section id="tab-emergency" class="tab-panel hidden">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg md:text-xl font-bold text-gray-800">🚨 Emergency Alerts</h2>
        <button id="refreshEmergencyBtn" class="text-xs bg-gray-100 px-3 py-1 rounded-lg">🔄 Refresh</button>
      </div>
      <div id="emergencyList" class="space-y-3">
        <p class="text-sm text-gray-400">No active emergency alerts</p>
      </div>
    </div>
  </section>

  <!-- ========== TAB 4: REFERRALS ========== -->
  <section id="tab-referrals" class="tab-panel hidden">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-4">🔀 Refer Patient</h2>

      <div class="grid md:grid-cols-2 gap-4 text-sm">
        <div>
          <label class="text-xs text-gray-500 font-medium">Patient Health ID</label>
          <input id="refPatientId" class="w-full border rounded-xl p-3 mt-1" placeholder="IHMS-XXXXXX" />
        </div>
        <div>
          <label class="text-xs text-gray-500 font-medium">Refer To Department</label>
          <select id="refDept" class="w-full border rounded-xl p-3 mt-1">
            <option>Cardiology</option>
            <option>Neurology</option>
            <option>Orthopedics</option>
            <option>Gastroenterology</option>
            <option>Pediatrics</option>
            <option>General Surgery</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="text-xs text-gray-500 font-medium">Reason / Notes</label>
          <textarea id="refNotes" rows="3" class="w-full border rounded-xl p-3 mt-1" placeholder="Reason for referral..."></textarea>
        </div>
      </div>

      <button id="refSaveBtn" class="mt-5 w-full bg-[#006a4e] hover:bg-[#005a42] text-white py-3 rounded-xl font-medium">
        🔀 Create Referral
      </button>
      <p id="refStatus" class="text-xs text-green-700 mt-2 text-center"></p>
    </div>
  </section>

  <!-- ========== TAB 5: APPOINTMENTS ========== -->
  <section id="tab-schedule" class="tab-panel hidden">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-4">📅 My Appointments Today</h2>
      <div id="apptList" class="space-y-3">
        <p class="text-sm text-gray-400">Loading...</p>
      </div>
    </div>
  </section>

</main>

<script type="module" src="js/doctor.js"></script>
</body>
</html>
