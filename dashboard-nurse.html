<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#006a4e" />
<title>Nurse Station · IHMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-slate-50 pb-20">

<nav class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#006a4e] to-[#00875a] flex items-center justify-center text-white text-lg font-bold shadow">👩‍⚕️</div>
      <div>
        <h1 class="font-bold text-gray-800 text-sm">IHMS</h1>
        <p class="text-[9px] text-gray-400 tracking-widest">NURSE STATION</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="nurseName" class="hidden md:block text-sm text-gray-600 font-medium"></span>
      <button id="logoutBtn" class="text-xs md:text-sm px-3 md:px-4 py-2 rounded-lg border border-gray-200">Logout</button>
    </div>
  </div>
</nav>

<div class="bg-white border-b border-gray-200 sticky top-16 z-30">
  <div class="max-w-7xl mx-auto px-2 md:px-4 flex gap-1 overflow-x-auto no-scrollbar">
    <button data-tab="calls" class="tab-btn active">🚨 Live Calls</button>
    <button data-tab="vitals" class="tab-btn">📝 Log Vitals</button>
    <button data-tab="patients" class="tab-btn">👥 My Patients</button>
    <button data-tab="treat" class="tab-btn">💉 Add Treatment</button>
  </div>
</div>

<main class="max-w-7xl mx-auto p-3 md:p-6">

  <!-- CALLS -->
  <section id="tab-calls" class="tab-panel">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-gray-800">🚨 Incoming Calls</h2>
        <button id="refreshBtn" class="text-xs bg-gray-100 px-3 py-1 rounded-lg">🔄 Refresh</button>
      </div>
      <div id="callsList" class="space-y-3">
        <p class="text-sm text-gray-400">Loading...</p>
      </div>
    </div>
  </section>

  <!-- VITALS -->
  <section id="tab-vitals" class="tab-panel hidden">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h2 class="text-lg font-bold text-gray-800 mb-4">📝 Log Patient Vitals</h2>
      <div class="space-y-3 text-sm max-w-lg">
        <input id="vPatientId" class="w-full border rounded-xl p-3" placeholder="Patient Health ID" />
        <div class="grid grid-cols-2 gap-3">
          <input id="vBP" class="border rounded-xl p-3" placeholder="BP (e.g. 120/80)" />
          <input id="vPulse" type="number" class="border rounded-xl p-3" placeholder="Pulse" />
          <input id="vTemp" type="number" step="0.1" class="border rounded-xl p-3" placeholder="Temp °C" />
          <input id="vSpo2" type="number" class="border rounded-xl p-3" placeholder="SpO2 %" />
        </div>
        <textarea id="vNotes" rows="2" class="w-full border rounded-xl p-3" placeholder="Notes..."></textarea>
        <button id="vitalSaveBtn" class="w-full bg-[#006a4e] hover:bg-[#005a42] text-white py-3 rounded-xl font-medium">💾 Save Vitals</button>
        <p id="vitalStatus" class="text-xs text-green-700 text-center"></p>
      </div>
    </div>
  </section>

  <!-- PATIENTS -->
  <section id="tab-patients" class="tab-panel hidden">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h2 class="text-lg font-bold text-gray-800 mb-4">👥 Admitted Patients</h2>
      <div id="patientsList" class="space-y-3">
        <p class="text-sm text-gray-400">Loading...</p>
      </div>
    </div>
  </section>

  <!-- TREATMENT -->
  <section id="tab-treat" class="tab-panel hidden">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 max-w-lg mx-auto">
      <h2 class="text-lg font-bold text-gray-800 mb-4">💉 Log Treatment</h2>
      <div class="space-y-3 text-sm">
        <input id="tPatientId" class="w-full border rounded-xl p-3" placeholder="Patient Health ID (e.g. IHMS-1234)" />
        <input id="tName" class="w-full border rounded-xl p-3" placeholder="Treatment Name / Medicine" />
        <button id="addTreatBtn" class="w-full bg-[#006a4e] text-white py-3 rounded-xl font-medium">Save Treatment</button>
        <p id="tStatusMsg" class="text-xs text-green-700 text-center"></p>
      </div>
    </div>
  </section>

</main>

<script type="module" src="js/nurse.js"></script>
</body>
</html>
